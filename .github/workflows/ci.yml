name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Covers x86_64-linux, aarch64-linux and aarch64-darwin.
        # `nix flake check` skips incompatible systems, so the matrix is the
        # only way to actually exercise Darwin + ARM.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    # 'true' only when the CACHIX_AUTH_TOKEN secret exists, so the push step is a
    # clean no-op until you opt in (create the cache + add the secret).
    env:
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # Configure + push to the binary cache so downstream consumers auto-fetch
      # prebuilt outputs for this OS instead of compiling.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        if: env.HAS_CACHIX == 'true'
        with:
          name: gerchowl
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # One command runs shellcheck (build-time), the format/lint/licenses
      # checks, module evaluation, and the hermetic e2e (incl. the RCE
      # regression tests).
      - run: nix flake check -L
