name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Covers x86_64-linux, aarch64-linux and aarch64-darwin.
        # `nix flake check` skips incompatible systems, so the matrix is the
        # only way to actually exercise Darwin + ARM.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    # 'true' only when the CACHIX_AUTH_TOKEN secret exists, so the push step is a
    # clean no-op until you opt in (create the cache + add the secret).
    env:
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # Configure + push to the binary cache so downstream consumers auto-fetch
      # prebuilt outputs for this OS instead of compiling.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: env.HAS_CACHIX == 'true'
        with:
          name: gerchowl
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # One command runs the format/lint/licenses checks, the hermetic e2e
      # suites (incl. the RCE regression tests and the tg-onboard sops
      # round-trip), and the docs-from-code gate.
      - run: nix flake check -L
