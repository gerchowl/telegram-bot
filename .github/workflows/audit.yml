name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # weekly, Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Known-vulnerable Rust crates (RustSec advisory DB). Blocking.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix shell nixpkgs#cargo-audit --command cargo audit --file rust/Cargo.lock

  # CVEs in the runtime closure (openssl, curl, glibc, sops, …) via the
  # Nix-native scanner. Informational + weekly: glibc/openssl carry noisy,
  # often-disputed advisories, so this reports rather than blocks.
  vulnix:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: scan runtime closures for CVEs
        run: |
          paths=$(nix build .#telegram-bot-rs --no-link --print-out-paths)
          # shellcheck disable=SC2086
          nix shell nixpkgs#vulnix --command vulnix $paths || true

  # Block PRs that introduce known-vulnerable dependencies.
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
