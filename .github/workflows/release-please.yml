name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR (version bump + CHANGELOG) from Conventional
      # Commits; merging it tags vX.Y.Z and cuts a GitHub release.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When a release is cut, archive the exact Rust dependency sources
      # (cargo vendor) and attach them — so the build stays reproducible
      # long-term even if a crate is later yanked/removed from crates.io.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Vendor crate sources + third-party notices, attach to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          cargobin="$(nix build nixpkgs#cargo --no-link --print-out-paths)/bin"
          export PATH="$cargobin:$PATH"
          cd rust
          cargo vendor vendor > vendor-config.toml
          mkdir -p .cargo && mv vendor-config.toml .cargo/config.toml
          # Collect dependency license notices: the binaries statically link
          # these crates, so MIT (etc.) requires shipping their notices.
          {
            echo "Third-party license notices — telegram-bot $TAG"
            echo "Generated from cargo vendor; one section per dependency crate."
            echo
            for d in vendor/*/; do
              name=$(basename "$d")
              for f in "$d"LICENSE* "$d"LICENCE* "$d"COPYING* "$d"NOTICE* "$d"license* "$d"licence*; do
                [ -f "$f" ] || continue
                printf '===== %s (%s) =====\n' "$name" "$(basename "$f")"
                cat "$f"
                printf '\n'
              done
            done
          } > ../THIRD-PARTY-LICENSES.txt
          cd ..
          tar -czf vendor.tar.gz -C rust .
          gh release upload "$TAG" vendor.tar.gz THIRD-PARTY-LICENSES.txt --clobber
